name: Validate (build, install, ATF)

on:
  workflow_call:

jobs:
  build-and-install-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify keys.ts is up to date
        run: npx @servicenow/sdk build --frozenKeys

      - name: Install on yoyo (test instance)
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_AUTH_TYPE: oauth
          SN_SDK_INSTANCE_URL: https://yoyo.service-now.com
          SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_ID }}
          SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_SECRET }}
        run: npx @servicenow/sdk install

  atf-test:
    needs: build-and-install-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run ATF regression suite on yoyo
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_AUTH_TYPE: oauth
          SN_SDK_INSTANCE_URL: https://yoyo.service-now.com
          SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_ID }}
          SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_SECRET }}
        run: |
          set +e
          RESULT=$(npx @servicenow/sdk cicd testsuite run \
            --test-suite-name "Dev Passport Brazil Regression Suite" \
            -o json)
          EXIT_CODE=$?
          echo "$RESULT"

          MESSAGE=$(echo "$RESULT" | jq -r '.error.message // .result.message // empty' 2>/dev/null)
          DETAILS_URL=$(echo "$MESSAGE" | grep -oE 'https://[^[:space:]]+' | head -1)

          {
            echo "## ATF Regression Suite Result"
            echo
            if [ -n "$MESSAGE" ]; then
              echo '```'
              echo "$MESSAGE"
              echo '```'
            else
              echo '```json'
              echo "$RESULT"
              echo '```'
            fi
            if [ -n "$DETAILS_URL" ]; then
              echo
              echo "[Open test suite result on the instance]($DETAILS_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE
