name: Build, test, and promote to prod (basic auth) - main pipeline

on:
  push:
    branches:
      - main

jobs:
  validate:
    uses: ./.github/workflows/test-and-validate.yml
    secrets: inherit

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to yoyo (test instance)
        run: |
          echo "${{ secrets.SN_SDK_USER_PWD }}" | npx @servicenow/sdk auth \
            --add https://yoyo.service-now.com \
            --type basic \
            --alias test \
            --username jon.lind \
            --password-stdin

      - name: Publish to Application Repository
        run: |
          npx @servicenow/sdk cicd publish \
            --auth test \
            -o json

  approve-prod:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Manual approval gate
        run: echo "Approved for production install"

  install-prod:
    needs: approve-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to zorb (prod instance)
        run: |
          echo "${{ secrets.SN_SDK_PROD_USER_PWD }}" | npx @servicenow/sdk auth \
            --add https://zorb.service-now.com \
            --type basic \
            --alias prod \
            --username jon.lind \
            --password-stdin

      - name: Install published app on zorb
        run: |
          npx @servicenow/sdk cicd install \
            --auth prod \
            -o json
