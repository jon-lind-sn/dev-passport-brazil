name: Deploy to Prod

on:
  push:
    branches:
      - main

jobs:
  validate:
    uses: ./.github/workflows/_validate.yml
    with:
      instance-url: ${{ vars.SN_SDK_TEST_INSTANCE_URL }}
      auth-type: ${{ vars.SN_SDK_TEST_AUTH_TYPE }}
      alias: test
      basic-username: ${{ vars.SN_SDK_TEST_USER }}
    secrets:
      basic-password: ${{ secrets.SN_SDK_TEST_USER_PWD }}
      oauth-client-id: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_ID }}
      oauth-client-secret: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_SECRET }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: now-sdk auth
        id: auth
        uses: ./.github/actions/sn-sdk-auth
        with:
          auth-type: ${{ vars.SN_SDK_TEST_AUTH_TYPE }}
          instance-url: ${{ vars.SN_SDK_TEST_INSTANCE_URL }}
          alias: test
          basic-username: ${{ vars.SN_SDK_TEST_USER }}
          basic-password: ${{ secrets.SN_SDK_TEST_USER_PWD }}
          oauth-client-id: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_SECRET }}

      - name: Publish to Application Repository
        run: |
          set +e
          RESULT=$(npx @servicenow/sdk cicd publish \
            ${{ steps.auth.outputs.cicd-auth-flag }} \
            -o json)
          EXIT_CODE=$?
          echo "$RESULT"

          if [ $EXIT_CODE -ne 0 ]; then
            VERSION=$(jq -r .version package.json)
            MESSAGE=$(echo "$RESULT" | jq -r '.error.message // empty' 2>/dev/null)
            echo "::error title=Publish failed::${MESSAGE:-unknown error}. The auth step already logged in successfully, so this is usually not a credentials problem. Application Repository versions are immutable: check whether version ${VERSION} (package.json) was already published and bump it."
          fi
          exit $EXIT_CODE

  approve-prod:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Manual approval gate
        run: echo "Approved for production install"

  install-prod:
    needs: approve-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: now-sdk auth
        id: auth
        uses: ./.github/actions/sn-sdk-auth
        with:
          auth-type: ${{ vars.SN_SDK_PROD_AUTH_TYPE }}
          instance-url: ${{ vars.SN_SDK_PROD_INSTANCE_URL }}
          alias: prod
          basic-username: ${{ vars.SN_SDK_PROD_USER }}
          basic-password: ${{ secrets.SN_SDK_PROD_USER_PWD }}
          oauth-client-id: ${{ secrets.SN_SDK_PROD_OAUTH_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.SN_SDK_PROD_OAUTH_CLIENT_SECRET }}

      - name: Install published app to prod instance
        run: |
          npx @servicenow/sdk cicd install \
            ${{ steps.auth.outputs.cicd-auth-flag }} \
            -o json
