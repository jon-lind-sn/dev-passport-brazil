name: Deploy to Prod

on:
  push:
    branches:
      - main

jobs:
  validate:
    uses: ./.github/workflows/_validate.yml
    with:
      instance-url: https://yoyo.service-now.com
      auth-type: ${{ vars.SN_SDK_TEST_AUTH_TYPE || 'oauth' }}
      alias: test
    secrets:
      basic-password: ${{ secrets.SN_SDK_USER_PWD }}
      oauth-client-id: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_ID }}
      oauth-client-secret: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_SECRET }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: now-sdk auth
        id: auth
        uses: ./.github/actions/sn-sdk-auth
        with:
          auth-type: ${{ vars.SN_SDK_TEST_AUTH_TYPE || 'oauth' }}
          instance-url: https://yoyo.service-now.com
          alias: test
          basic-password: ${{ secrets.SN_SDK_USER_PWD }}
          oauth-client-id: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_SECRET }}

      - name: Publish to Application Repository
        run: |
          npx @servicenow/sdk cicd publish \
            ${{ steps.auth.outputs.cicd-auth-flag }} \
            -o json

  approve-prod:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Manual approval gate
        run: echo "Approved for production install"

  install-prod:
    needs: approve-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: now-sdk auth
        id: auth
        uses: ./.github/actions/sn-sdk-auth
        with:
          auth-type: ${{ vars.SN_SDK_PROD_AUTH_TYPE || 'basic' }}
          instance-url: https://zorb.service-now.com
          alias: prod
          basic-password: ${{ secrets.SN_SDK_PROD_USER_PWD }}
          oauth-client-id: ${{ secrets.SN_SDK_PROD_OAUTH_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.SN_SDK_PROD_OAUTH_CLIENT_SECRET }}

      - name: Install published app on zorb
        run: |
          npx @servicenow/sdk cicd install \
            ${{ steps.auth.outputs.cicd-auth-flag }} \
            -o json
